{% extends "layout.html" %}
{% block title %}Agenda — Config{% endblock %}
{% block page_title %}Agenda — Página pública{% endblock %}
{% block content %}
<div class="p-6 max-w-xl mx-auto space-y-6">
  <a href="{{ url_for('scheduling.home') }}" class="text-sm text-teal-700 hover:underline">← Agenda</a>
  <form method="post" action="{{ url_for('scheduling.home', tab='clinica') }}" class="space-y-4 bg-white p-5 rounded-xl border border-slate-200">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
    <input type="hidden" name="action" value="save_clinica">
    <input type="hidden" name="return_tab" value="clinica">
    <div>
      <label class="text-xs text-slate-500">Nome público</label>
      <input name="public_name" value="{{ settings.public_name or '' }}" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Clínica Exemplo">
    </div>
    <div>
      <label class="text-xs text-slate-500">Slug (URL /agenda/&lt;slug&gt;)</label>
      <input name="public_slug" value="{{ settings.public_slug or '' }}" class="w-full border rounded-lg px-3 py-2 text-sm font-mono" placeholder="minha-clinica">
    </div>
    <div>
      <label class="text-xs text-slate-500">Fuso horário</label>
      {% set selected_tz = settings.timezone or 'America/Sao_Paulo' %}
      {% include 'scheduling/_timezone_select.html' %}
    </div>
    <button class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium">Guardar</button>
  </form>
</div>
{% endblock %}
