{% extends "layout.html" %}
{% block title %}Profissionais{% endblock %}
{% block page_title %}Agenda — Profissionais{% endblock %}
{% block content %}
<div class="p-6 max-w-3xl mx-auto space-y-6">
  <a href="{{ url_for('scheduling.home') }}" class="text-sm text-teal-700 hover:underline">← Agenda</a>
  <form method="post" class="flex gap-2 items-end bg-white p-4 rounded-xl border border-slate-200">
    <input type="hidden" name="action" value="add">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
    <div class="flex-1">
      <label class="text-xs text-slate-500">Nome</label>
      <input name="name" class="w-full border rounded-lg px-3 py-2 text-sm" required placeholder="Ex.: Dra. Ana">
    </div>
    <button class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium">Adicionar</button>
  </form>
  <div class="bg-white rounded-xl border border-slate-200 divide-y">
    {% for p in professionals %}
    <div class="p-3 flex justify-between items-center text-sm">
      <span>{{ p.name }}</span>
      <form method="post" onsubmit="return confirm('Remover este profissional?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
        <input type="hidden" name="action" value="delete">
        <input type="hidden" name="id" value="{{ p.id }}">
        <button class="text-red-600 text-xs font-medium">Remover</button>
      </form>
    </div>
    {% else %}
    <p class="p-4 text-slate-500 text-sm">Nenhum profissional.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
